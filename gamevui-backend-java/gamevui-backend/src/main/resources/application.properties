# ===== Cau hinh ket noi SQL Server (tuong duong DB_CONFIG trong backend.py) =====
# Ban goc dung Trusted_Connection (Windows Auth). JDBC driver mssql-jdbc ho tro
# integratedSecurity=true NHUNG can co them file mssql-jdbc_auth-<version>.x64.dll
# trong PATH khi chay tren Windows. Neu khong the dung file .dll do, doi sang
# tai khoan SQL (uncomment 2 dong username/password ben duoi va sua lai chuoi url).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=gamevui_db;integratedSecurity=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.datasource.username=sa
# spring.datasource.password=your_password

# Khong tu dong sinh/sua schema - CSDL da co san (users, friends, messages...)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

server.port=5000

# QUAN TRONG: frontend cu (khong doi) dang gui/nhan JSON dang snake_case
# (vd "session_token", "room_code", "creator_name", "public_id"...).
# Dong nay bat Jackson tu dong doi camelCase (Java) <-> snake_case (JSON)
# de KHONG phai sua bat ky dong code frontend nao.
spring.jackson.property-naming-strategy=SNAKE_CASE

# ===== Cau hinh JWT (tuong duong SECRET_KEY / ALGORITHM / TOKEN_EXPIRE_HOURS) =====
# QUAN TRONG: doi chuoi nay thanh 1 chuoi ngau nhien that dai va bi mat truoc khi deploy that,
# giong hoan toan luu y trong file backend.py goc.
app.jwt.secret=hV9kLp2qXmZ8wRt4nJ6bYc1dFg5sAe3uT7yWiQ0oKzMxNvB2eS6cH8jD4rU1lP9a
app.jwt.expiration-hours=168

# ===== Cau hinh game / chong gian lan (tuong duong cac hang so trong backend.py) =====
app.game.session-ttl-seconds=3600
app.game.min-play-seconds=2
app.game.max-score-per-second=1000

app.duel.lobby-room-ttl-seconds=900
app.chess.score-delta=100
app.chess.report-ttl-seconds=1800

app.avatar.max-length=2000000